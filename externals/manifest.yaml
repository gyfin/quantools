schema_version: 1

policy:
  revision_source: root_gitlink
  url_source: .gitmodules
  update_mode: reviewed_single_dependency
  default_trust: untrusted_third_party
  default_lifecycle: pinned_reference
  promotion_mode: reproducible_evaluation_and_human_review
  upstream_update_mode: sandbox_then_review
  live_qmt_access: forbidden

components:
  - id: qlib
    path: externals/qlib
    upstream: https://github.com/microsoft/qlib.git
    category: research
    role: factor_research_and_ml
    trust_class: third_party_research

  - id: vectorbt
    path: externals/vectorbt
    upstream: https://github.com/polakowo/vectorbt.git
    category: research
    role: vectorized_parameter_experiments
    trust_class: third_party_research

  - id: lean
    path: externals/lean
    upstream: https://github.com/QuantConnect/Lean.git
    category: execution
    role: order_portfolio_and_simulation_engine
    trust_class: third_party_execution

  - id: kronos
    path: externals/Kronos
    upstream: https://github.com/shiyu-coder/Kronos.git
    category: research
    role: financial_time_series_foundation_model
    trust_class: third_party_research

  - id: quants_playbook
    path: externals/QuantsPlaybook
    upstream: https://github.com/hugo2046/QuantsPlaybook.git
    category: research
    role: factor_and_strategy_reference_collection
    trust_class: third_party_research

  - id: oskhquant
    path: externals/oskhquant
    upstream: https://github.com/khscience/OSkhQuant.git
    category: a_share_integration
    role: mini_qmt_reference_implementation
    trust_class: third_party_execution

  - id: kimi_cli
    path: externals/agent-hosts/kimi-cli
    upstream: https://github.com/MoonshotAI/kimi-cli.git
    category: agent_host
    role: optional_cli_agent_runtime
    trust_class: third_party_agent_host

  - id: kimi_code
    path: externals/agent-hosts/kimi-code
    upstream: https://github.com/MoonshotAI/kimi-code.git
    category: agent_host
    role: optional_coding_agent_runtime
    trust_class: third_party_agent_host

  - id: open_science
    path: externals/agent-hosts/open-science
    upstream: https://github.com/aipoch/open-science.git
    category: agent_host
    role: optional_local_research_workbench
    trust_class: third_party_agent_host

  - id: cangjie_skill
    path: externals/research-intake/cangjie-skill
    upstream: https://github.com/kangarooking/cangjie-skill.git
    category: research_intake
    role: cangjie_research_skill_reference
    trust_class: third_party_research_intake

  - id: paper2agent
    path: externals/research-intake/paper2agent
    upstream: https://github.com/jmiao24/Paper2Agent.git
    category: research_intake
    role: paper_to_agent_reference
    trust_class: third_party_research_intake

  - id: paper2code
    path: externals/research-intake/paper2code
    upstream: https://github.com/going-doer/paper2code.git
    category: research_intake
    role: paper_to_code_reference
    trust_class: third_party_research_intake

  - id: rd_agent
    path: externals/research-intake/rd-agent
    upstream: https://github.com/microsoft/RD-Agent.git
    category: research_intake
    role: automated_research_and_development_reference
    trust_class: third_party_research_intake

  - id: best_serenity_skill
    path: externals/research-methods/best-serenity-skill
    upstream: https://github.com/yux1azhengye/BestSerenitySkillFromAT.git
    category: research_method
    role: unified_supply_chain_bottleneck_method_reference
    trust_class: untrusted_third_party_research_method
    lifecycle: incubating
    integration_mode: reference_only
    license_spdx: MIT
    license_review: repository_license_verified_transitive_content_pending

  - id: serenity_bottleneck_hunter
    path: externals/research-methods/serenity-bottleneck-hunter
    upstream: https://github.com/Mrjie7205/serenity-bottleneck-hunter.git
    category: research_method
    role: focused_supply_chain_bottleneck_method_reference
    trust_class: untrusted_third_party_research_method
    lifecycle: incubating
    integration_mode: reference_only
    license_spdx: MIT
    license_review: repository_license_verified_transitive_content_pending

  - id: qilihei_stockagent
    path: externals/a-share-research/qilihei-stockagent
    upstream: https://github.com/qilihei/StockAgent.git
    category: a_share_research
    role: a_share_data_news_factor_backtest_and_agent_platform_reference
    trust_class: untrusted_third_party_financial_agent
    lifecycle: incubating
    integration_mode: reference_only
    approval_status: pending_review
    license_spdx: MIT
    license_review: repository_license_verified_transitive_content_and_service_terms_pending

  - id: mingyu_stockagent
    path: externals/simulation-engines/mingyu-stockagent
